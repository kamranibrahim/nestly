<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Nestly — the operating system for modern families.">
  <title>Nestly</title>
  <style>
    :root {
      --ink: #1c1c1e;
      --muted: #636366;
      --mint: #d4e7b3;
      --wash: #fafafb;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 2rem;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif;
      color: var(--ink);
      background:
        linear-gradient(135deg, rgba(212, 231, 179, 0.55), transparent 50%),
        var(--wash);
    }
    main { max-width: 28rem; text-align: center; }
    h1 { margin: 0 0 0.5rem; font-size: 2rem; letter-spacing: -0.03em; }
    p { margin: 0 0 1.25rem; color: var(--muted); line-height: 1.5; }
    nav { display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap; }
    a {
      color: var(--ink);
      font-weight: 700;
      text-decoration: none;
      border-bottom: 2px solid var(--mint);
    }
  </style>
</head>
<body>
  <main>
    <h1>Nestly</h1>
    <p>The family OS lives in the Nestly mobile app. A web experience will land here later.</p>
    <nav>
      <a href="/privacy">Privacy</a>
      <a href="/support">Support</a>
    </nav>
  </main>
</body>
</html>
