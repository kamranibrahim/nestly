# Nestly static site + API (privacy/support + Netlify Functions).
# Flutter web companion removed — a JS web app will replace it later.
#
# Deploy: netlify deploy --dir=web --prod --functions=netlify/functions

[build]
  command = "echo 'Static web/ — no Flutter build'"
  publish = "web"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

[[redirects]]
  from = "/support"
  to = "/support.html"
  status = 200

[[redirects]]
  from = "/privacy"
  to = "/privacy.html"
  status = 200

# Function uses config.path = /api/parse-document (takes priority over SPA).
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
