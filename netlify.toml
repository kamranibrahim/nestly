# Nestly web companion (Flutter web) + AI parse API
#
# Local:  flutter run -d chrome
# Build:  flutter build web --release
# Deploy: npx netlify deploy --dir=build/web --prod
#
# After first production deploy, enable AI Gateway in the Netlify UI.
# Functions live in netlify/functions (path /api/parse-document).

[build]
  command = "git clone https://github.com/flutter/flutter.git -b stable --depth 1 $HOME/flutter && export PATH=\"$PATH:$HOME/flutter/bin\" && flutter config --no-analytics && flutter config --enable-web && flutter pub get && flutter build web --release"
  publish = "build/web"
  functions = "netlify/functions"

[build.environment]
  FLUTTER_WEB = "true"
  NODE_VERSION = "22"

# Function uses config.path = /api/parse-document (takes priority over SPA).
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
